services:
  postgres:
    image: postgres:16-alpine
    container_name: auto_yt_web_ko_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: auto_yt_ko
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auto_yt_ko"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - web_ko_postgres_data:/var/lib/postgresql/data

volumes:
  web_ko_postgres_data:
