services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: web2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: web2
      POSTGRES_USER: web2
      POSTGRES_PASSWORD: web2_local_password
    ports:
      - "5435:5432"
    volumes:
      - web2_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/001-enable-vector.sql:/docker-entrypoint-initdb.d/001-enable-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web2 -d web2"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  web2_postgres_data:
