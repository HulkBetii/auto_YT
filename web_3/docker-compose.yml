services:
  postgres:
    image: postgres:17-alpine
    container_name: web3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: web3
      POSTGRES_USER: web3
      POSTGRES_PASSWORD: web3_local_password
    ports:
      - "5433:5432"
    volumes:
      - web3_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web3 -d web3"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  web3_postgres_data:
